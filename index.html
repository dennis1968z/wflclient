<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no,email=no,address=no" />
<title>WFL 信号</title>
<meta name="description" content="输入股票代码，查看背后技术资产的 0–100 演示信号与参数。合成数据 · 非投资建议。" />
<style>
:root{
  --paper:#f0ece2; --paper-2:#f7f4ec; --ink:#191814; --ink-2:#55524a; --mute:#7d7767; --rule:#d6cfbe; --rule-2:#b9b19b;
  --bronze:#76663f; --sub:#2a4d7a; --com:#1f6b5c; --con:#9b2f22; --dk:#191814; --bone:#ece6d6; --bone-2:#b3ac98;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC","Noto Serif CJK SC","Source Han Serif SC",STSong,SimSun,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","HarmonyOS Sans SC","Noto Sans CJK SC","Microsoft YaHei",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
  --gut:20px; --hh:56px; color-scheme:light;
}
body[data-lang="zh"]{--serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",STSong,"Iowan Old Style",Georgia,SimSun,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,dl,dd{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{width:min(1120px,100% - 2*var(--gut));margin-inline:auto}
@media (min-width:800px){:root{--gut:40px;--hh:64px}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eb{font:500 11px/1.5 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--bronze)}
body[data-lang="zh"] .eb{letter-spacing:.12em}
.hs{font-family:var(--serif);font-weight:400;letter-spacing:-.03em;line-height:1.05;text-wrap:balance}
body[data-lang="zh"] .hs{letter-spacing:-.01em;line-height:1.24;font-weight:500}
.btn{display:flex;align-items:center;justify-content:center;min-height:54px;padding:0 26px;background:var(--ink);color:var(--bone);border:1px solid var(--ink);font:700 14px var(--sans);letter-spacing:.05em;text-align:center;width:100%}
.btn.ghost{background:transparent;color:var(--ink)}
.lk{display:inline-flex;align-items:center;min-height:44px;font:500 13px var(--sans);border-bottom:1px solid var(--ink);padding:0;align-self:flex-start;line-height:1.2}
.note{font:400 12px/1.65 var(--mono);color:var(--ink-2)}
.note::before{content:"※ ";color:var(--bronze)}

/* header */
.hd{position:sticky;top:0;z-index:60;background:var(--paper);border-bottom:1px solid var(--rule)}
.hd .wrap{display:flex;align-items:center;height:var(--hh);gap:12px}
.wm{font:700 13px var(--sans);letter-spacing:.28em;white-space:nowrap}
.dtag{padding:3px 8px;border:1px solid var(--bronze);color:var(--bronze);font:500 10px var(--mono);letter-spacing:.16em}
.lang{margin-left:auto;display:flex;align-items:center;font:500 12px var(--sans);color:var(--mute)}
.lang button{min-width:44px;min-height:44px;display:grid;place-items:center;color:var(--mute)}
.lang button.on{color:var(--ink);font-weight:700}
.mini{position:fixed;top:var(--hh);left:0;right:0;z-index:55;display:none;align-items:center;justify-content:space-between;gap:12px;height:44px;padding:0 var(--gut);background:var(--ink);color:var(--bone);font:500 13px var(--mono);letter-spacing:.04em}
.mini.on{display:flex}
.mini b{font:400 22px var(--serif);letter-spacing:-.02em}

/* tool */
.tool{padding:26px 0 18px}
.tool h1{font-size:clamp(34px,10.4vw,72px);margin-top:12px;max-width:14ch}
body[data-lang="zh"] .tool h1{font-size:clamp(30px,8.8vw,60px);max-width:12em}
.tool .lead{margin-top:10px;color:var(--ink-2);max-width:52ch;font-size:16px}
.q{display:flex;flex-direction:column;gap:10px;margin-top:20px;max-width:640px}
.q label{font:500 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--bronze)}
body[data-lang="zh"] .q label{letter-spacing:.1em}
.q input{display:block;width:100%;min-height:60px;padding:0 18px;border:2px solid var(--ink);background:var(--paper-2);font:500 22px var(--mono);letter-spacing:.06em;border-radius:0;-webkit-appearance:none;appearance:none}
.q input::placeholder{font:400 15px var(--sans);letter-spacing:0;color:var(--mute)}
.q input:focus{outline:3px solid rgba(25,24,20,.25);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:8px calc(-1*var(--gut)) 0;padding:0 var(--gut);max-width:none}
.chips::-webkit-scrollbar{display:none}
.chips span{flex:none;align-self:center;font:400 11px var(--mono);letter-spacing:.12em;color:var(--mute);text-transform:uppercase;margin-right:2px}
.chips button{flex:none;min-height:44px;padding:0 16px;border:1px solid var(--rule-2);font:500 13px var(--mono);letter-spacing:.04em}
.chips button.on{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.msg{margin-top:6px;font:400 12px/1.65 var(--mono);color:var(--con);min-height:0}.msg:empty{display:none}
.msg.info{color:var(--bronze)}
@media (min-width:800px){.tool{padding:72px 0 40px}.q{flex-direction:row;align-items:stretch;flex-wrap:wrap}.q label{flex-basis:100%}.q input{flex:1;min-width:0}.q .btn{width:auto;min-width:200px}.chips{margin-inline:0;padding-inline:0}}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:36px;padding:14px 0 64px}
.grid>*{min-width:0}
@media (min-width:960px){.grid{grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:56px;align-items:start}.params{position:sticky;top:calc(var(--hh) + 24px)}}

/* result */
.card{border:1px solid var(--ink);background:var(--paper-2)}
.ct{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--ink)}
.ct .tk{font:500 26px var(--mono);letter-spacing:.02em;line-height:1}
.ct .nm{font:400 15px var(--sans);color:var(--ink-2);margin-top:6px}
.ct .mk{font:400 10px var(--mono);letter-spacing:.16em;color:var(--mute);border:1px solid var(--rule-2);padding:3px 8px;flex:none}
.asset{padding:12px 18px;border-bottom:1px solid var(--rule);font:400 11px/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--bronze)}
.asset b{font:400 15px var(--serif);letter-spacing:0;text-transform:none;color:var(--ink);display:block;margin-top:2px}
body[data-lang="zh"] .asset b{font-weight:500}
.sc{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:20px 18px 6px}
.sc .n{font:400 clamp(92px,28vw,140px)/.92 var(--serif);letter-spacing:-.05em}
.sc .of{font:400 15px var(--mono);color:var(--mute);margin-left:6px}
.rt{display:inline-flex;align-items:center;padding:5px 12px;font:700 12px var(--mono);letter-spacing:.16em;border:1px solid var(--ink);margin-bottom:12px}
.rt.STRONG{background:var(--ink);color:var(--bone)} .rt.WATCH{border-style:dashed;color:var(--con);border-color:var(--con)}
.rd{padding:6px 18px 18px;font:400 17px/1.5 var(--serif);letter-spacing:-.005em;color:var(--ink)}
body[data-lang="zh"] .rd{font-weight:500;font-size:16.5px}
.blk{padding:18px;border-top:1px solid var(--rule)}
.blk h3{font:500 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--bronze);margin-bottom:10px;display:flex;justify-content:space-between;gap:10px}
body[data-lang="zh"] .blk h3{letter-spacing:.12em}
.blk h3 span{font:400 11px var(--mono);letter-spacing:.04em;text-transform:none;color:var(--mute)}
.ch{display:block;width:100%;height:auto}
.ch text{font:400 10px var(--mono);fill:var(--mute)}
.ch .g{stroke:var(--rule);stroke-width:1}
.lgd{display:flex;flex-wrap:wrap;gap:4px 16px;font:400 11px var(--mono);color:var(--ink-2);margin-top:8px}
.lgd i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.bd li{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.bd li:last-child{border-bottom:0}
.bd .k{font-size:14px;color:var(--ink-2)}
.bd .k small{font:400 11px var(--mono);color:var(--mute);margin-left:6px}
.bd .v{font:500 15px var(--mono);text-align:right}
.bd li.tot{border-top:1px solid var(--ink);margin-top:4px;padding-top:12px}
.bd li.tot .k{color:var(--ink);font-weight:700}
.bd li.tot .v{font-size:18px}
.rel li{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--rule)}
.rel li:last-child{border-bottom:0}
.rel i{width:10px;height:10px;border-radius:50%;margin-top:5px}
.rel .n{font-size:14px}.rel .n small{display:block;font:400 11px var(--mono);color:var(--mute)}
.rel .s{font:500 15px var(--mono)}
.evl li{padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px;color:var(--ink-2);display:grid;grid-template-columns:58px 1fr;gap:10px}
.evl li:last-child{border-bottom:0}
.evl b{font:500 12px var(--mono);color:var(--ink);padding-top:2px}
.acts{display:flex;flex-wrap:wrap;gap:6px 22px;padding:6px 18px 16px;border-top:1px solid var(--rule)}

/* params */
.params .card{background:var(--paper)}
.params .hdr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--ink)}
.params .hdr h2{font:500 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--bronze)}
body[data-lang="zh"] .params .hdr h2{letter-spacing:.12em}
.params .in{padding:6px 18px 20px}
.fl{display:block;font:500 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--bronze);margin:20px 0 8px}
body[data-lang="zh"] .fl{letter-spacing:.1em}
select{display:block;width:100%;min-height:52px;padding:0 44px 0 14px;border:1px solid var(--ink);background:var(--paper-2);font-size:16px;border-radius:0;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 22px) 23px,calc(100% - 16px) 23px;background-size:6px 6px;background-repeat:no-repeat}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media (min-width:520px) and (max-width:959px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 20px}}
.sl{margin-top:14px}
.two+.sl{margin-top:28px}
.slh{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.slh span{font:400 20px var(--serif);letter-spacing:-.01em}
body[data-lang="zh"] .slh span{font-weight:500}
.slh b{font:500 20px var(--mono)}
input[type=range]{display:block;width:100%;height:44px;margin:2px 0 0;background:transparent;-webkit-appearance:none;appearance:none}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-12.5px;background:var(--ink);border:4px solid var(--paper);box-shadow:0 0 0 1px var(--ink);border-radius:0}
input[type=range]::-moz-range-track{height:3px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;background:var(--ink);border:4px solid var(--paper);border-radius:0;box-shadow:0 0 0 1px var(--ink)}
.ck{display:flex;align-items:center;gap:14px;min-height:56px;margin-top:6px;padding:6px 0;border-top:1px dashed var(--rule-2);cursor:pointer}
.ck input{flex:none;width:26px;height:26px;margin:0;accent-color:var(--ink)}
.ck b{display:block;font:500 15px var(--sans)}
.ck small{display:block;font-size:12px;color:var(--mute);line-height:1.45}
details.adv{margin-top:22px;border-top:1px solid var(--ink)}
details.adv summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:52px;font:500 13px var(--sans);cursor:pointer}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::after{content:"+";font:300 22px var(--sans)}
details.adv[open] summary::after{content:"\2212"}
.rr{padding:14px 0;border-top:1px solid var(--rule)}
.rr .nm{font-size:14px;margin-bottom:8px}
.rr .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;align-items:center}
.rr select{min-height:46px;font-size:15px}
.rr .sv{display:flex;align-items:center;gap:10px}
.rr .sv b{font:500 15px var(--mono);min-width:26px;text-align:right}

footer{background:#12110e;color:var(--bone-2);padding:36px 0 calc(32px + env(safe-area-inset-bottom))}
footer .wm{color:var(--bone)}
footer p{margin-top:10px;font:400 11px/1.8 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,16px);z-index:200;max-width:min(92vw,420px);background:var(--ink);color:var(--bone);padding:13px 20px;font:500 14px var(--sans);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center;border:1px solid var(--bone-2)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001s!important}}
</style>
</head>

<header class="hd"><div class="wrap">
  <span class="wm">WFL ·</span><span class="dtag" data-i="demo"></span>
  <div class="lang" role="group" aria-label="Language"><button data-lang="en" class="on">EN</button><span>/</span><button data-lang="zh">中文</button></div>
</div></header>
<div class="mini" id="mini" aria-hidden="true"><span id="miniT"></span><b id="miniN"></b></div>

<main>
<section class="tool"><div class="wrap">
  <div class="eb" data-i="eb"></div>
  <h1 class="hs" data-i="h1"></h1>
  <p class="lead" data-i="lead"></p>
  <form class="q" id="qf" autocomplete="off">
    <label for="qi" data-i="lbl"></label>
    <input id="qi" type="text" data-ph="ph" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" maxlength="24">
    <button class="btn" type="submit" data-i="go"></button>
  </form>
  <div class="chips" id="chips"></div>
  <p class="msg" id="msg" role="status"></p>
</div></section>

<div class="wrap"><div class="grid">
  <article class="card" id="res" aria-live="polite">
    <div class="ct"><div><div class="tk" id="rTk"></div><div class="nm" id="rNm"></div></div><span class="mk" id="rMk"></span></div>
    <div class="asset"><span data-i="asset"></span><b id="rAsset"></b></div>
    <div class="sc"><div><span class="n" id="bigScore"></span><span class="of">/ 100</span></div><span class="rt" id="rRt"></span></div>
    <p class="rd" id="rRd"></p>
    <div class="blk"><h3><b style="font-weight:inherit" data-i="path"></b><span id="winL"></span></h3><div id="chart"></div>
      <div class="lgd"><span><i style="border-color:#76663f;opacity:.6"></i><span data-i="lg.p"></span></span><span><i style="border-color:#191814;border-top-width:3px"></i><span data-i="lg.m"></span></span></div></div>
    <div class="blk"><h3 data-i="why"></h3><ul class="bd" id="bd"></ul></div>
    <div class="blk"><h3 data-i="rels"></h3><ul class="rel" id="rel"></ul></div>
    <div class="blk"><h3><b style="font-weight:inherit" data-i="ev"></b></h3><ul class="evl" id="evl"></ul></div>
    <div class="acts"><button class="lk" data-act="copy" data-i="a.copy"></button><button class="lk" data-act="link" data-i="a.link"></button><button class="lk" data-act="json" data-i="a.json"></button></div>
  </article>

  <aside class="params" aria-label="Parameters"><div class="card">
    <div class="hdr"><h2 data-i="pm"></h2><button class="lk" data-act="reset" data-i="reset"></button></div>
    <div class="in">
      <div class="two">
        <div><label class="fl" for="pWin" data-i="win"></label><select id="pWin"><option value="30" data-i="d30"></option><option value="90" data-i="d90"></option><option value="180" data-i="d180"></option></select></div>
        <div><label class="fl" for="pEvt" data-i="evt"></label><select id="pEvt"><option value="neutral" data-i="ev.neutral"></option><option value="positive" data-i="ev.positive"></option><option value="stress" data-i="ev.stress"></option></select></div>
      </div>
      <div class="sl"><div class="slh"><span data-i="ft"></span><b id="vT"></b></div><input type="range" id="pT" min="0" max="100" step="1" aria-label="Technology"></div>
      <div class="sl"><div class="slh"><span data-i="fi"></span><b id="vIP"></b></div><input type="range" id="pIP" min="0" max="100" step="1" aria-label="IP"></div>
      <label class="ck" for="pBk"><input type="checkbox" id="pBk"><span><b data-i="bk"></b><small data-i="bk.d"></small></span></label>
      <div class="sl"><div class="slh"><span data-i="fd"></span><b id="vI"></b></div><input type="range" id="pI" min="0" max="100" step="1" aria-label="Industry"></div>
      <details class="adv"><summary data-i="adv"></summary><div id="advBody"></div></details>
      <p class="note" style="margin-top:20px" data-i="pm.n"></p>
    </div>
  </div></aside>
</div></div>
</main>

<footer><div class="wrap"><div class="wm">WFL ·</div><p data-i="disc"></p><p data-i="disc2"></p></div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function compute(prof,p){
  let S=0;p.rel.forEach((r,i)=>{S+=RW[i]*SGN[r.type]*r.s/100;});
  const relAdj=Math.round(S*200)/10,ipEff=Math.min(100,p.IP+(p.booked?5:0)),base=.45*p.T+.30*ipEff+.25*p.I;
  const eb={neutral:0,positive:5,stress:-6}[p.evt],evtAdj=Math.round(eb*(.6+.4*p.win/180)*10)/10;
  const raw=base+relAdj+evtAdj,score=Math.round(clamp(raw,0,100)),rating=score>=70?'STRONG':score>=55?'MODERATE':'WATCH';
  const rnd=mulberry(hash(prof.k+JSON.stringify(p))),NP=24,ST=30,drift=(eb*.9+S*4)/ST,sig=(2.5+p.win/180*4)/Math.sqrt(ST);

$('#qf').addEventListener('submit',e=>{e.preventDefault();submit($('#qi').value);});
document.addEventListener('input',e=>{
  if(!cur)return;const t0=e.target,id=t0.id;touched=true;
  if(id==='pT'){P.T=+t0.value;render();}else if(id==='pIP'){P.IP=+t0.value;render();}else if(id==='pI'){P.I=+t0.value;render();}
  else if(t0.dataset&&t0.dataset.rs!==undefined){P.rel[+t0.dataset.rs].s=+t0.value;render();}
});
document.addEventListener('change',e=>{
  if(!cur)return;const t0=e.target,id=t0.id;touched=true;
  if(id==='pBk'){P.booked=t0.checked;render();}else if(id==='pWin'){P.win=+t0.value;render();}else if(id==='pEvt'){P.evt=t0.value;render();}
  else if(t0.dataset&&t0.dataset.rt!==undefined){P.rel[+t0.dataset.rt].type=t0.value;render();}
});
/* sticky mini score when the big score scrolls out of view */
if('IntersectionObserver' in window){
  const hh=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hh'))||56;
  new IntersectionObserver(en=>{const out=!en[0].isIntersecting&&en[0].boundingClientRect.top<0;$('#mini').classList.toggle('on',out);},{rootMargin:'-'+(hh+4)+'px 0px 0px 0px'}).observe($('#bigScore'));
}

/* ================= init ================= */
(function init(){
  const h=readHash();
  if(h){cur=h.res;P=h.P;$('#qi').value=h.res.p.k;touched=true;}
  else{cur=resolve('NVDA');P=defaults(cur.p);}
  applyLang();buildParams();render();
  $$('#chips button').forEach(b=>b.classList.toggle('on',b.dataset.t===cur.p.k));
  if(cur.generic){$('#msg').className='msg info';$('#msg').textContent=t('generic');}
})();
</script>
</body>
</html>
